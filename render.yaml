services:
  # Backend API Service - Native Node.js buildpack
  - type: web
    name: api-manager-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        value: mongodb+srv://admin_db_user:eFuqxb1VvoQmRLgT@cluster0.mongodb.net/api-manager?retryWrites=true&w=majority&appName=Cluster0
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        value: https://api-manager-frontend.onrender.com
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: UPSTREAM_TIMEOUT_MS
        value: "10000"
    autoDeploy: true

  # Frontend Static Site - Native static buildpack
  - type: static
    name: api-manager-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_API_URL
        value: https://api-manager-backend.onrender.com
    autoDeploy: true