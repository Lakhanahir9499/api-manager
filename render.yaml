version: "1"
services:
  # Backend API Service (Blueprint supported)
  - type: web
    name: api-manager-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        value: https://api-manager-frontend.onrender.com
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: UPSTREAM_TIMEOUT_MS
        value: "10000"
    autoDeploy: true