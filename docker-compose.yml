version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: api-manager-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - api-manager-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-manager-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/api-manager
      - CORS_ORIGIN=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - api-manager-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api-manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - api-manager-network

  nginx:
    image: nginx:alpine
    container_name: api-manager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - api-manager-network

  certbot:
    image: certbot/certbot
    container_name: api-manager-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  mongo_data:

networks:
  api-manager-network:
    driver: bridge